# =============================================================================
# MODEL CATEGORIES (for filtering and recommendations)
# =============================================================================
categories:
  cost_effective:
    - naga-gpt-4o-mini
    - naga-text-embedding-3-small
    - openrouter-claude-haiku
    - gemini-embedding-001
    
  high_quality:
    - gpt-4o
    - openrouter-claude-sonnet
    - text-embedding-3-large
    - naga-text-embedding-3-large
    
  best_value:  # Quality score >= 7, lowest cost in category
    - naga-gpt-4o
    - naga-qwen-72b
    - naga-text-embedding-3-large
    
  recommended_chat:
    - naga-gpt-4o  # Best balance of cost/quality
    - openrouter-claude-sonnet  # Highest quality
    - naga-gpt-4o-mini  # Most cost-effective
    
  recommended_embedding:
    - naga-text-embedding-3-large  # Best balance (winner from tests)
    - text-embedding-3-small  # Baseline
    - gemini-embedding-001  # Free option
    
  recommended_judge:
    - judge-mistral-large  # Best reliability (9.7/10)
    - judge-claude-sonnet  # Highest quality (9.8/10)
    - judge-gpt-4o  # Most cost-effective

