wiki_pages:
  - title: "Project Overview"
    slug: "project-overview"
    content: |
      # tofu.aicl - AI Infrastructure as Code

      ## Mission
      Build an AI-powered platform that enables declarative definition and execution of complex AI workflows through infrastructure as code principles.

      ## Architecture
      - **Core Engine**: HCL-based declarative configuration with dependency resolution
      - **Providers**: Pluggable components for different AI services (OpenRouter, Pinecone, file processing, etc.)
      - **State Management**: Persistent state tracking across executions
      - **CI/CD**: Automated building and deployment of provider containers

      ## Key Features
      - Declarative AI workflow definition
      - Dependency graph resolution
      - Provider registry and metadata management
      - Docker container-based provider deployment
      - GitHub Actions and Azure DevOps integration
    created_date: "2025-10-04"
    updated_date: "2025-10-05"

  - title: "Provider Protocol"
    slug: "provider-protocol"
    content: |
      # Provider Protocol Specification

      ## Overview
      All providers must implement the gRPC Provider service defined in `proto/provider.proto`.

      ## Service Definition
      ```protobuf
      service Provider {
        rpc GetMetadata(google.protobuf.Empty) returns (Metadata);
        rpc ValidateConfig(Config) returns (ValidationResult);
        rpc ExecutePlan(ExecutionPlan) returns (ExecutionResult);
        rpc GetHealth(google.protobuf.Empty) returns (HealthStatus);
      }
      ```

      ## Implementation Requirements
      - gRPC server running on port 50051
      - Structured logging with correlation IDs
      - Health check endpoint
      - Configuration validation
      - Error handling and retry logic

      ## Docker Requirements
      - Python 3.11+ base image
      - All dependencies in requirements.txt
      - Proto files compiled at build time
      - Server startup script
    created_date: "2025-10-04"
    updated_date: "2025-10-05"

  - title: "Core Engine Design"
    slug: "core-engine-design"
    content: |
      # Core Engine Architecture

      ## Components

      ### Parser
      - Loads and parses HCL configuration files
      - Validates syntax and structure
      - Extracts resource definitions and dependencies

      ### Planner
      - Builds dependency graph from resource relationships
      - Performs topological sort for execution order
      - Validates graph for cycles and missing dependencies

      ### Executor
      - Orchestrates provider execution
      - Manages resource lifecycle (create, update, delete)
      - Handles parallel execution and error recovery

      ### StateManager
      - Persists execution state across runs
      - Tracks resource versions and metadata
      - Provides state querying capabilities

      ## Execution Flow
      1. Parse HCL files into resource definitions
      2. Build dependency graph and validate
      3. Execute resources in dependency order
      4. Update state with results
    created_date: "2025-10-04"
    updated_date: "2025-10-05"

  - title: "Bootstrap Instructions"
    slug: "bootstrap-instructions"
    content: |
      # GitHub + Azure Deployment Bootstrap

      ## Architecture
      - **Code Repository**: GitHub (`github.com/zacharyelston/tofu-aicl`)
      - **CI/CD**: GitHub Actions (`.github/workflows/ci.yml`)
      - **Container Registry**: Azure Container Registry (`ancerallc.azurecr.io`)
      - **Deployment**: Azure (infrastructure managed separately)

      ## Setup Steps

      ### 1. GitHub Repository Secrets
      ```bash
      CONTAINER_REGISTRY=ancerallc.azurecr.io
      CONTAINER_REGISTRY_USERNAME=<acr-username>
      CONTAINER_REGISTRY_PASSWORD=<acr-password>
      ```

      ### 2. Azure Service Principal
      ```bash
      az ad sp create-for-rbac --name tofu-aicl-github-actions --role AcrPush --scopes /subscriptions/.../Microsoft.ContainerRegistry/registries/ancerallc
      ```

      ### 3. Development Workflow
      - Create feature branches for new work
      - Test locally with .env file
      - Submit PRs for review
      - GitHub Actions handles building and deployment
    created_date: "2025-10-05"
    updated_date: "2025-10-05"

  - title: "Contributing Guidelines"
    slug: "contributing-guidelines"
    content: |
      # Contributing to tofu-aicl

      ## Development Setup

      ### Prerequisites
      - Python 3.11+
      - Docker and Docker Compose
      - Git and GitHub CLI
      - Azure CLI (for deployment)

      ### Local Development
      ```bash
      # Clone repository
      git clone git@github.com:zacharyelston/tofu-aicl.git
      cd tofu-aicl

      # Set up virtual environment
      python -m venv venv
      source venv/bin/activate  # On Windows: venv\Scripts\activate

      # Install dependencies
      pip install -e .

      # Set up environment variables
      cp .env.example .env
      # Edit .env with your API keys
      ```

      ## Code Standards

      ### Commit Messages
      Use Conventional Commits format:
      ```
      type(scope): description

      [optional body]

      [optional footer]
      ```

      Valid types: feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert

      ### Code Style
      - Black for Python formatting
      - flake8 for linting
      - Type hints encouraged
      - Docstrings for public functions

      ## Testing
      ```bash
      # Run all tests
      pytest tests/

      # Run with coverage
      pytest tests/ --cov=src --cov-report=html

      # Run specific provider test
      python run.py test_file.aicl
      ```
    created_date: "2025-10-05"
    updated_date: "2025-10-05"

  - title: "Critical Fixes Summary"
    slug: "critical-fixes-summary"
    content: |
      # Critical Fixes Applied (2025-10-05)

      ## Issues Resolved

      ### 1. Dependency Resolution ✅
      - **Problem**: Sequential execution without proper dependency ordering
      - **Solution**: Implemented topological sort in Planner component
      - **Impact**: Resources now execute in correct dependency order

      ### 2. Engine Architecture ✅
      - **Problem**: Monolithic AICLEngine class with mixed responsibilities
      - **Solution**: Decomposed into Parser, Planner, Executor, StateManager
      - **Impact**: Better separation of concerns and testability

      ### 3. Docker Build Issues ✅
      - **Problem**: Provider Dockerfiles had incorrect COPY paths
      - **Solution**: Updated all Dockerfiles to use repository-relative paths
      - **Impact**: All provider containers now build successfully

      ### 4. CI/CD Pipeline ✅
      - **Problem**: Complex bootstrap pipeline with manual steps
      - **Solution**: Simplified to single self-contained pipeline
      - **Impact**: Fully automated building and deployment

      ### 5. Security ✅
      - **Problem**: .env file with secrets in git history
      - **Solution**: Removed from history and added to .gitignore
      - **Impact**: Repository secure with no exposed credentials

      ## Files Modified
      - `src/aicl/core/engine.py` - Refactored into smaller components
      - `src/aicl/parser.py` - New parser component
      - `src/aicl/planner.py` - New planner with topological sort
      - `src/aicl/executor.py` - New executor component
      - `azure-pipelines.yml` - Simplified CI/CD pipeline
      - `.github/workflows/ci.yml` - Added GitHub Actions
      - All provider Dockerfiles - Fixed COPY paths

      ## Next Steps
      - Implement native HCL evaluation context
      - Add centralized provider registry
      - Validate rag_pipeline_test.aicl end-to-end
    created_date: "2025-10-05"
    updated_date: "2025-10-05"

