issues:
  - id: 965
    tracker: "Support"
    status: "New"
    priority: "Immediate"
    author: "Claude Anthropic"
    subject: "Refactor: Core Engine Modularity and Dependency Resolution"
    description: |
      ## Goal
      Refactor the core engine to improve modularity, implement robust dependency resolution, and align with best practices for a declarative framework.

      ## Key Areas for Improvement

      1. **Dependency Graph:** Replace the sequential execution loop with a true dependency graph (using topological sort) to ensure resources are always processed in the correct order.
      2. **HCL Evaluation Context:** Implement a proper HCL evaluation context to allow the `hcl2` library to natively resolve `${...}` interpolations. This is the correct and idiomatic way to handle dependencies.
      3. **Provider Registry:** Introduce a centralized provider registry to manage provider metadata (image, version, etc.), removing this logic from the HCL files.
      4. **Engine Decomposition:** Break down the monolithic `AICLEngine` into smaller, more focused components:
          - `Parser`: Responsible for loading and parsing HCL files.
          - `Planner`: Responsible for building the dependency graph.
          - `Executor`: Responsible for orchestrating the providers and executing the plan.
          - `StateManager`: (Already exists, but will be used by the other components).

      ## Acceptance Criteria

      1. The `rag_pipeline_test.aicl` experiment runs successfully, demonstrating correct dependency resolution.
      2. The `AICLEngine` class is significantly smaller and delegates work to the new components.
      3. The HCL files no longer contain provider-specific metadata like container images.
    created_date: "2025-10-04T04:40:08Z"
    updated_date: "2025-10-05T04:20:19Z"
