# RAG Test Configuration
# Configure models, questions, and test parameters for RAG validation

# Models to test (OpenRouter format)
models:
  - name: "Claude 3.5 Sonnet"
    id: "anthropic/claude-3.5-sonnet"
    enabled: true
  - name: "GPT-4"
    id: "openai/gpt-4"
    enabled: true
  - name: "GPT-4o"
    id: "openai/gpt-4o"
    enabled: true
  - name: "GPT-4o-mini"
    id: "openai/gpt-4o-mini"
    enabled: true
  - name: "Mistral Large"
    id: "mistralai/mistral-large"
    enabled: true
  - name: "Claude 3 Opus"
    id: "anthropic/claude-3-opus"
    enabled: false
  - name: "Gemini 1.5 Pro"
    id: "google/gemini-pro-1.5"
    enabled: false

# Test configuration
test_config:
  # Number of questions to test (from questions.txt)
  num_questions: 3
  
  # Pinecone namespace for vector search
  pinecone_namespace: "tofu-aicl-codebase"
  
  # Top-k results from vector search
  top_k: 5
  
  # Embedding model
  embedding_model: "text-embedding-3-small"
  
  # Max tokens for LLM responses
  max_tokens: 500
  
  # Judge model for quality grading
  judge_model: "openai/gpt-4"
  
  # Quality grading criteria
  quality_criteria:
    - accuracy
    - relevance
    - completeness

# Output configuration
output:
  directory: "experiments/rag-graded-results"
  save_configs: true
  save_state_files: true
  
# System prompt for RAG responses
system_prompt: |
  You are an expert on the AICL framework. Answer questions accurately based on 
  the provided code context. Be specific and reference actual implementation details.

# Questions file
questions_file: "questions.txt"
