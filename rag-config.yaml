# RAG System Configuration
# All settings for RAG testing and evaluation

# ============================================
# FILES TO INDEX
# ============================================
files_to_index:
  # Priority: 1. Use this list, 2. Scan rag-config/ dir, 3. Default hardcoded
  # Leave empty to use directory scanning or defaults
  - src/aicl/parser.py
  - src/aicl/evaluator.py
  - src/aicl/planner.py
  - src/aicl/executor.py
  - src/aicl/core/engine.py
  - src/aicl/state/manager.py
  - src/aicl/provider_registry.py

# ============================================
# MODELS TO TEST
# ============================================
models_to_test:
  - model_id: anthropic/claude-3.5-sonnet
    display_name: Claude 3.5 Sonnet
    
  - model_id: openai/gpt-4
    display_name: GPT-4
    
  # Add more models as needed
  # - model_id: openai/gpt-4o
  #   display_name: GPT-4o

# ============================================
# LLM JUDGE CONFIGURATION
# ============================================
judge:
  model: anthropic/claude-3.5-sonnet
  temperature: 0.1
  max_tokens: 1000

# ============================================
# EVALUATION PROMPT TEMPLATE
# ============================================
evaluation_prompt: |
  You are an expert evaluator assessing RAG system outputs. Compare these answers to the question and rate each on:

  1. **Accuracy** (0-10): Correctness based on technical details
  2. **Completeness** (0-10): How thoroughly it answers the question
  3. **Clarity** (0-10): How well-explained and understandable
  4. **Code Specificity** (0-10): References to actual code/files

  Question: {question}

  {answers}

  Provide your evaluation in JSON format:
  {{
    "evaluations": [
      {{"model": "model_name", "accuracy": X, "completeness": X, "clarity": X, "code_specificity": X, "total": X, "reasoning": "brief explanation"}},
      ...
    ],
    "winner": "model_name",
    "summary": "brief comparison summary"
  }}

# ============================================
# SYSTEM PROMPT FOR ANSWERING
# ============================================
system_prompt: |
  You are a helpful assistant that answers questions about the tofu-aicl codebase based on provided context.

# ============================================
# USER PROMPT TEMPLATE FOR ANSWERING
# ============================================
user_prompt_template: |
  Context:
  {context}

  Question: {question}

  Provide a clear, technical answer based on the context above.

# ============================================
# RETRIEVAL SETTINGS
# ============================================
retrieval:
  top_k: 10  # Number of chunks to retrieve from Pinecone
  code_chunks_to_use: 3  # Top N code files to include in context
  doc_chunks_to_use: 2   # Top N doc files to include in context
  min_chunk_size: 50     # Skip chunks smaller than this

# ============================================
# MODEL SETTINGS
# ============================================
model_settings:
  temperature: 0.3
  max_tokens: 500

# ============================================
# CHUNKING SETTINGS (for indexing)
# ============================================
chunking:
  chunk_size: 1000
  overlap: 200
  min_chunk_size: 50

# ============================================
# PINECONE SETTINGS
# ============================================
pinecone:
  namespace: tofu-aicl-codebase
  embedding_model: text-embedding-3-small
  embedding_dimensions: 1024
