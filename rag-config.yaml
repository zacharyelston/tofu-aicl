# RAG Test Configuration
# Configure models, questions, and test parameters for RAG validation

# Models to test (OpenRouter/Naga.ai format)
models:
  # Top performing models from validation
  - name: "Mistral Large"
    id: "mistralai/mistral-large"
    provider: "openrouter"  # or "naga" for 50% lower cost
    enabled: true
  - name: "GPT-4o-mini"
    id: "openai/gpt-4o-mini"
    provider: "openrouter"
    enabled: true
  - name: "GPT-4o"
    id: "openai/gpt-4o"
    provider: "openrouter"
    enabled: true
  - name: "Claude 3.5 Sonnet"
    id: "anthropic/claude-3.5-sonnet"
    provider: "openrouter"
    enabled: true
  
  # Naga.ai models (same models, 50% cheaper)
  # Note: Use "naga_chat" resource type until config-driven provider selection is implemented
  - name: "GPT-4o (Naga.ai)"
    id: "openai/gpt-4o"
    provider: "naga"
    resource_type: "naga_chat"
    enabled: false
  
  # Additional models (disabled)
  - name: "GPT-4"
    id: "openai/gpt-4"
    provider: "openrouter"
    enabled: false

# Test configuration
test_config:
  # Number of questions to test (from questions.txt)
  num_questions: 3
  
  # Parallel execution settings
  parallel: true
  max_workers: 4  # Number of parallel workers
  
  # Pinecone namespace for vector search
  pinecone_namespace: "tofu-aicl-codebase"
  
  # Top-k results from vector search
  top_k: 5
  
  # Embedding model
  embedding_model: "text-embedding-3-small"
  
  # Max tokens for LLM responses
  max_tokens: 500
  
  # Judge model for quality grading
  judge_model: "openai/gpt-4"
  
  # Quality grading criteria
  quality_criteria:
    - accuracy
    - relevance
    - completeness

# Output configuration
output:
  directory: "experiments/rag-graded-results"
  save_configs: true
  save_state_files: true
  
# System prompt for RAG responses
system_prompt: |
  You are an expert on the AICL framework. Answer questions accurately based on 
  the provided code context. Be specific and reference actual implementation details.

# Questions file
questions_file: "questions.txt"
