# RAG Provider Comparison Experiment Configuration
# Defines the matrix of experiments to run with State as DNA lineage tracking

experiment_phases:
  phase1:
    name: "Basic 3-Provider Comparison"
    description: "Initial comparison across three LLM providers"
    providers:
      - openai
      - azure
      - openrouter
    context_sizes:
      - medium
    expected_experiments: 3

  phase2:
    name: "3x3 Provider × Context Matrix"
    description: "Full matrix of providers and context sizes"
    providers:
      - openai
      - azure
      - openrouter
    context_sizes:
      - small
      - medium
      - large
    expected_experiments: 9

  phase3:
    name: "Fine-Grained 6x3 Analysis"
    description: "Detailed analysis with multiple context variations"
    providers:
      - openai
      - azure
      - openrouter
    context_sizes:
      - tiny      # 1K tokens
      - small     # 2K tokens
      - medium    # 8K tokens
      - large     # 16K tokens
      - xlarge    # 32K tokens
      - xxlarge   # 64K tokens
    expected_experiments: 18

# Provider configurations
providers:
  openai:
    name: "OpenAI"
    embedding_model: "text-embedding-ada-002"
    chat_model: "gpt-4"
    api_base: "https://api.openai.com/v1"
    cost_per_1k_tokens:
      embedding: 0.0001
      query: 0.03
    max_context: 8192

  azure:
    name: "Azure OpenAI"
    embedding_model: "text-embedding-ada-002"
    chat_model: "gpt-4"
    api_base: "${AZURE_OPENAI_ENDPOINT}"
    api_version: "2024-02-01"
    cost_per_1k_tokens:
      embedding: 0.0001
      query: 0.03
    max_context: 8192

  openrouter:
    name: "OpenRouter"
    embedding_model: "text-embedding-ada-002"
    chat_model: "openai/gpt-4"
    api_base: "https://openrouter.ai/api/v1"
    cost_per_1k_tokens:
      embedding: 0.00005
      query: 0.015
    max_context: 8192

# Context size configurations
context_sizes:
  tiny:
    name: "Tiny Context"
    max_tokens: 1024
    max_files: 5
    description: "Minimal context for basic queries"

  small:
    name: "Small Context"
    max_tokens: 2048
    max_files: 10
    description: "Small context for focused queries"

  medium:
    name: "Medium Context"
    max_tokens: 8192
    max_files: 25
    description: "Standard context for most queries"

  large:
    name: "Large Context"
    max_tokens: 16384
    max_files: 50
    description: "Large context for complex queries"

  xlarge:
    name: "Extra Large Context"
    max_tokens: 32768
    max_files: 100
    description: "Very large context for comprehensive analysis"

  xxlarge:
    name: "Extra Extra Large Context"
    max_tokens: 65536
    max_files: 200
    description: "Maximum context for exhaustive analysis"

# Test queries for RAG evaluation
test_queries:
  - query: "How does tofu-aicl handle state management?"
    category: "architecture"
    expected_sources: ["src/aicl/state/", "docs/design/state-as-dna/"]
    difficulty: "medium"

  - query: "What providers are supported for AI operations?"
    category: "providers"
    expected_sources: ["src/aicl/providers/", "APIDocs/"]
    difficulty: "easy"

  - query: "How do you configure API keys for different services?"
    category: "configuration"
    expected_sources: ["docs/", "examples/"]
    difficulty: "easy"

  - query: "What is the State as DNA model and how does lineage tracking work?"
    category: "advanced"
    expected_sources: ["docs/design/state-as-dna/", "src/aicl/state/models.py"]
    difficulty: "hard"

  - query: "How can I implement a custom provider for a new AI service?"
    category: "development"
    expected_sources: ["src/aicl/providers/", "docs/"]
    difficulty: "hard"

  - query: "What are the cost implications of different embedding strategies?"
    category: "optimization"
    expected_sources: ["docs/", "examples/"]
    difficulty: "medium"

# Evaluation metrics
evaluation_metrics:
  relevance_score:
    weight: 0.4
    description: "How relevant are the retrieved documents"
    scale: "0.0 to 1.0"

  response_quality:
    weight: 0.3
    description: "Quality of the generated response"
    scale: "0.0 to 1.0"

  latency:
    weight: 0.2
    description: "Response time performance"
    scale: "lower is better (ms)"

  cost_efficiency:
    weight: 0.1
    description: "Cost per query"
    scale: "lower is better (USD)"

# State file naming convention
state_naming:
  pattern: "{phase}_{provider}_{context_size}_{git_sha}"
  examples:
    - "phase1_openai_medium_a1b2c3d4.tfstate"
    - "phase2_azure_large_a1b2c3d4.tfstate"
    - "phase3_openrouter_tiny_a1b2c3d4.tfstate"

# Git integration settings
git_integration:
  capture_sha: true
  capture_branch: true
  capture_uncommitted_changes: true
  create_snapshots: true
  snapshot_includes:
    - "src/**/*.py"
    - "docs/**/*.md"
    - "APIDocs/**/*.md"
    - "examples/**/*"
    - "*.md"
    - "*.yaml"
    - "*.yml"

# Output and reporting
reporting:
  generate_html_reports: true
  generate_comparison_charts: true
  include_cost_analysis: true
  include_performance_trends: true
  export_formats:
    - json
    - csv
    - html
    - pdf
