# tofu-aicl CI/CD Pipeline
# Validates, tests, builds, and publishes provider containers

name: tofu-aicl-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: '3.11'
  dockerRegistryServiceConnection: 'tofu-aicl-acr-connection'
  containerRegistry: 'ancerallc.azurecr.io'

stages:
  # ============================================
  # VALIDATION STAGE
  # ============================================
  - stage: Validate
    displayName: 'Code Validation'
    jobs:
      - job: Lint
        displayName: 'Lint & Format Check'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install flake8 black
            displayName: 'Install linting tools'

          - script: 'flake8 src/ --count --show-source --statistics'
            displayName: 'Run flake8'
            continueOnError: true

          - script: 'black --check src/'
            displayName: 'Check code formatting'
            continueOnError: true

  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Provider Containers'
    dependsOn: Validate
    jobs:
      - job: BuildProviders
        displayName: 'Build All Providers'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build file_loader provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/file_loader/Dockerfile'
              buildContext: '.'
              repository: 'aicl/file_loader'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build text_splitter provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/text_splitter/Dockerfile'
              buildContext: '.'
              repository: 'aicl/text_splitter'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build openrouter provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/openrouter/Dockerfile'
              buildContext: '.'
              repository: 'aicl/openrouter'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build pinecone provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/pinecone/Dockerfile'
              buildContext: '.'
              repository: 'aicl/pinecone'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Build command_assertion provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/command_assertion/Dockerfile'
              buildContext: '.'
              repository: 'aicl/command_assertion'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================
  # TEST STAGE
  # ============================================
  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -e .
              pip install pytest pytest-cov
            displayName: 'Install dependencies'

          - script: |
              pytest tests/ --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=html
            displayName: 'Run pytest'
            continueOnError: true

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              failTaskOnFailedTests: false
            displayName: 'Publish test results'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
            displayName: 'Publish coverage results'

  # ============================================
  # PUBLISH STAGE (only on main/develop)
  # ============================================
  - stage: Publish
    displayName: 'Publish Containers'
    dependsOn: Test
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
    jobs:
      - job: PushContainers
        displayName: 'Push to Registry'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Push file_loader'
            inputs:
              command: 'push'
              repository: 'aicl/file_loader'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push text_splitter'
            inputs:
              command: 'push'
              repository: 'aicl/text_splitter'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push openrouter'
            inputs:
              command: 'push'
              repository: 'aicl/openrouter'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push pinecone'
            inputs:
              command: 'push'
              repository: 'aicl/pinecone'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push command_assertion'
            inputs:
              command: 'push'
              repository: 'aicl/command_assertion'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest