# tofu-aicl CI/CD Pipeline
# Validates code quality, runs tests, and builds provider containers
name: tofu-aicl-$(Date:yyyyMMdd)$(Rev:.r)

# Triggers
trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

# PR validation
pr:
  branches:
    include:
      - main
      - develop

# Common variables
variables:
  pythonVersion: '3.11'
  dockerRegistryServiceConnection: 'ancera'
  containerRegistry: 'ancera.azurecr.io'

# Pipeline stages
stages:
  # ============================================
  # VALIDATION STAGE
  # ============================================
  - stage: Validate
    displayName: 'Code Validation'
    jobs:
      - job: Lint
        displayName: 'Lint Python Code'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install flake8 black mypy
            displayName: 'Install linting tools'

          - script: |
              flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
              flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            displayName: 'Run flake8'
            continueOnError: true

          - script: |
              black --check src/
            displayName: 'Check code formatting'
            continueOnError: true

  # ============================================
  # BUILD STAGE
  # ============================================
  - stage: Build
    displayName: 'Build Provider Containers'
    dependsOn: Validate
    jobs:
      - job: BuildProviders
        displayName: 'Build All Providers'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build file_loader provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/file_loader/Dockerfile'
              buildContext: '.'
              tags: |
                $(containerRegistry)/aicl/file_loader:$(Build.BuildId)
                $(containerRegistry)/aicl/file_loader:latest

          - task: Docker@2
            displayName: 'Build text_splitter provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/text_splitter/Dockerfile'
              buildContext: '.'
              tags: |
                $(containerRegistry)/aicl/text_splitter:$(Build.BuildId)
                $(containerRegistry)/aicl/text_splitter:latest

          - task: Docker@2
            displayName: 'Build openrouter provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/openrouter/Dockerfile'
              buildContext: '.'
              tags: |
                $(containerRegistry)/aicl/openrouter:$(Build.BuildId)
                $(containerRegistry)/aicl/openrouter:latest

          - task: Docker@2
            displayName: 'Build pinecone provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/pinecone/Dockerfile'
              buildContext: '.'
              tags: |
                $(containerRegistry)/aicl/pinecone:$(Build.BuildId)
                $(containerRegistry)/aicl/pinecone:latest

          - task: Docker@2
            displayName: 'Build command_assertion provider'
            inputs:
              command: 'build'
              Dockerfile: 'providers/command_assertion/Dockerfile'
              buildContext: '.'
              tags: |
                $(containerRegistry)/aicl/command_assertion:$(Build.BuildId)
                $(containerRegistry)/aicl/command_assertion:latest

  # ============================================
  # TEST STAGE
  # ============================================
  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -e .
              pip install pytest pytest-cov
            displayName: 'Install dependencies'

          - script: |
              pytest tests/ --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=html
            displayName: 'Run pytest'
            continueOnError: true

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              failTaskOnFailedTests: true
            displayName: 'Publish test results'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
            displayName: 'Publish coverage results'

      - job: IntegrationTests
        displayName: 'Integration Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -e .
            displayName: 'Install dependencies'

          - script: |
              ./scripts/build_providers.sh
            displayName: 'Build provider containers'

          - script: |
              ./scripts/run_experiment.sh file_loader_test.aicl
            displayName: 'Test file_loader provider'
            continueOnError: true

  # ============================================
  # PUBLISH STAGE (only on main/develop)
  # ============================================
  - stage: Publish
    displayName: 'Publish Containers'
    dependsOn: Test
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
    jobs:
      - job: PushContainers
        displayName: 'Push to Registry'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: 'login'
              containerRegistry: '$(dockerRegistryServiceConnection)'

          - script: |
              echo "Push containers to registry"
              # Add push commands here
            displayName: 'Push provider containers'
