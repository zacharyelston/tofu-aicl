# tofu-aicl CI/CD Pipeline
# Validates, tests, builds, and publishes provider containers.
# This pipeline is self-contained and does not require a separate bootstrap pipeline.

name: tofu-aicl-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: '3.11'
  containerRegistry: 'ancerallc.azurecr.io'

stages:
  # ============================================
  # VALIDATION STAGE
  # ============================================
  - stage: Validate
    displayName: 'Code Validation'
    jobs:
      - job: Lint
        displayName: 'Lint & Format Check'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install flake8 black
            displayName: 'Install linting tools'

          - script: 'flake8 src/ --count --show-source --statistics'
            displayName: 'Run flake8'

          - script: 'black --check src/'
            displayName: 'Check code formatting'

  # ============================================
  # BUILD & TEST STAGE
  # ============================================
  - stage: BuildAndTest
    displayName: 'Build & Test'
    dependsOn: Validate
    jobs:
      - job: Main
        displayName: 'Build, Test, and Push'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build, Tag, and Push Provider Containers'
            inputs:
              # IMPORTANT: This requires a one-time manual authorization in ADO project settings
              # to grant the pipeline's service principal the 'AcrPush' role on the ACR.
              azureSubscription: 'ancera-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true # Exposes SP_ID, SP_KEY, and TENANT_ID as env vars
              inlineScript: |
                set -e
                echo "Logging in to ACR..."
                az acr login --name $(containerRegistry) --expose-token

                PROVIDERS=("file_loader" "text_splitter" "openrouter" "pinecone" "command_assertion")

                for provider in "${PROVIDERS[@]}"; do
                  echo "--- Building $provider provider ---"
                  docker build \
                    -f providers/$provider/Dockerfile \
                    -t $(containerRegistry)/aicl/$provider:$(Build.BuildId) \
                    -t $(containerRegistry)/aicl/$provider:latest \
                    .

                  # Only push if on main or develop branch
                  if [[ "$(Build.SourceBranch)" == "refs/heads/main" || "$(Build.SourceBranch)" == "refs/heads/develop" ]]; then
                    echo "--- Pushing $provider container ---"
                    docker push $(containerRegistry)/aicl/$provider:$(Build.BuildId)
                    docker push $(containerRegistry)/aicl/$provider:latest
                  fi
                done

                echo "✅ All providers built successfully."

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install -e .
              pip install pytest pytest-cov
            displayName: 'Install test dependencies'

          - script: |
              pytest tests/ --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=html
            displayName: 'Run pytest'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
