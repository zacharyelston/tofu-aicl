# Bootstrap Pipeline - Run Once to Create Service Connections
# This pipeline creates the Azure DevOps service connections needed for the main pipeline.

trigger: none  # Manual trigger only
pr: none     # Don't run on PRs

parameters:
  - name: managementServiceConnection
    displayName: 'Management Azure RM Service Connection'
    type: string
    default: 'ancera-service-connection' # Default, but can be overridden at runtime

resources:
  repositories:
    - repository: iac
      type: git
      name: ancera-iac/ancera-iac

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
  - checkout: iac

  - task: AzureCLI@2
    displayName: 'Bootstrap: Create ACR Service Connection'
    inputs:
      azureSubscription: ${{ parameters.managementServiceConnection }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        echo "🚀 Starting tofu-aicl bootstrap..."
        
        # Make the script executable
        chmod +x ./iac/modules/bootstrap/scripts/create-acr-service-connection.sh

        # Run the bootstrap script from ancera-iac
        ./iac/modules/bootstrap/scripts/create-acr-service-connection.sh \
          --project "$(System.TeamProject)" \
          --organization "$(System.CollectionUri)" \
          --acr-name "ancerallc" \
          --service-connection-name "tofu-aicl-acr-connection"
        
        echo "✅ Bootstrap complete! Service connection 'tofu-aicl-acr-connection' is ready."
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
