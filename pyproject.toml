[project]
name = "tofu-aicl"
version = "0.1.0"
description = "A declarative framework for ephemeral AI infrastructure."
dependencies = [
    "python-hcl2>=4.0.0",
    "docker>=5.0.0",
    "grpcio>=1.39.0",
    "grpcio-tools>=1.39.0",
    "protobuf>=3.19.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]
